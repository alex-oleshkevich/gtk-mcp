name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloaded .debs are cached: the runner's apt mirror can be slow enough
      # to stall a run.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-qa-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install system libraries
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libgtk-4-dev libglib2.0-dev libadwaita-1-dev libgtk4-layer-shell-dev \
            pkg-config gobject-introspection python3-gi gjs
          sudo chown -R "$USER" ~/apt-archives

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The tree still has clippy warnings and is not rustfmt-clean, so neither
      # gates the run yet. This step keeps the warnings visible.
      - name: Clippy (not gated)
        run: cargo clippy --workspace --all-targets
