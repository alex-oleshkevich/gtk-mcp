name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libglib2.0-dev libadwaita-1-dev pkg-config
          if ! pkg-config --exists gtk4-layer-shell-0; then
            sudo apt-get install -y libgtk4-layer-shell-dev || true
          fi
          if ! pkg-config --exists gtk4-layer-shell-0; then
            sudo apt-get install -y meson ninja-build git libwayland-dev wayland-protocols gobject-introspection libgirepository1.0-dev
            git clone --depth 1 https://github.com/wmww/gtk4-layer-shell /tmp/gtk4-layer-shell
            meson setup /tmp/gls-build /tmp/gtk4-layer-shell -Ddocs=false -Dtests=false -Dexamples=false -Dintrospection=false -Dvapi=false
            meson compile -C /tmp/gls-build
            sudo meson install -C /tmp/gls-build
            sudo ldconfig
          fi
          pkg-config --exists gtk4-layer-shell-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The tree currently has clippy warnings and is not rustfmt-clean,
      # so neither is a gate yet. This step keeps warnings visible.
      - name: Clippy (not gated)
        run: cargo clippy --workspace --all-targets
