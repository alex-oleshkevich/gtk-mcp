[workspace]
resolver = "3"
members = [
    "crates/gtk-mcp-protocol",
    "crates/gtk-mcp-agent",
    "crates/gtk-mcp",
    "crates/gtk-mcp-fixture",
    "crates/gtk-mcp-agent-capi",
]
default-members = [
    "crates/gtk-mcp-protocol",
    "crates/gtk-mcp-agent",
    "crates/gtk-mcp",
    "crates/gtk-mcp-fixture",
    "crates/gtk-mcp-agent-capi",
]
exclude = ["spikes"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/alex-oleshkevich/gtk-mcp"
homepage = "https://github.com/alex-oleshkevich/gtk-mcp"
readme = "README.md"
keywords = ["gtk", "gtk4", "mcp", "libadwaita", "inspector"]
categories = ["gui", "development-tools::debugging"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
anyhow = "1"
libc = "0.2"
gtk4 = { version = "0.11", features = ["v4_10"] }
glib = "0.22"
gio = "0.22"
async-channel = "2.5"
gtk-mcp-protocol = { path = "crates/gtk-mcp-protocol", version = "0.2.0" }
gtk-mcp-agent = { path = "crates/gtk-mcp-agent", version = "0.2.0" }
